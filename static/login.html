<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · SplitMate</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main>
    <h1>SplitMate</h1>
    <form id="login-form" novalidate>
      <label>E-mail <input id="email" name="email" type="email" autocomplete="email" required></label>
      <label>Password <input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button id="login-button" type="submit">Sign in</button>
    </form>
  </main>
  <script src="/static/js/login.js"></script>
</body>
</html>
