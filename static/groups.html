<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My groups · SplitMate</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main>
    <header>
      <h1>My groups</h1>
      <button id="logout" class="link" type="button">Sign out</button>
    </header>
    <p id="groups-loading" class="state muted" role="status">Loading your groups…</p>
    <p id="groups-empty" class="state" hidden>You are not in any group yet. When someone invites you to a flat or a trip, it appears here.</p>
    <p id="groups-error" class="state error" role="alert" hidden></p>
    <ul id="groups-list" class="list" hidden></ul>
  </main>
  <script src="/static/js/groups.js"></script>
</body>
</html>
